<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>새김역 성경 (SKV) — Saegim Korean Version | 온라인 성경 통독·검색</title>
  <meta name="description" content="Berean Standard Bible(BSB) 영문 원문을 바탕으로 독자 번역한 현대 한국어 성경 '새김역 성경(SKV, Saegim Korean Version)' 66권(구약 39권·신약 27권) 전체 온라인 통독 및 본문 검색 서비스입니다." />
  <meta name="keywords" content="새김역 성경, SKV, Saegim Korean Version, Standard Korean Version, Steady Korean Version, 한국어 성경, 온라인 성경, 성경 통독, 성경 검색, 구약, 신약, Berean Standard Bible, BSB" />
  <meta name="author" content="새김역 성경 (SKV) Contributors" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#2563eb" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:site_name" content="새김역 성경 (SKV)" />
  <meta property="og:title" content="새김역 성경 (SKV) — 66권 온라인 성경 통독·검색" />
  <meta property="og:description" content="Berean Standard Bible(BSB) 기반 독자 한국어 번역 성경 66권(1,189장, 31,086절)을 웹에서 바로 읽고 검색할 수 있습니다." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="새김역 성경 (SKV) — 66권 온라인 성경 통독·검색" />
  <meta name="twitter:description" content="Berean Standard Bible(BSB) 기반 독자 한국어 번역 성경 66권 온라인 통독 및 본문 검색" />
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --heading-color: #0f172a;
      --verse-num: #3b82f6;
      --footnote-bg: #f8fafc;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      --font-size: 17px;
    }

    [data-theme="sepia"] {
      --bg: #f4ecd8;
      --surface: #fbf6ea;
      --surface-2: #ede2c8;
      --text: #3d3124;
      --text-muted: #7a6855;
      --border: #dfd1b4;
      --accent: #9a5b13;
      --accent-soft: #f5e6cf;
      --heading-color: #2b2116;
      --verse-num: #9a5b13;
      --footnote-bg: #f3e9d2;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #60a5fa;
      --accent-soft: #1e3a5f;
      --heading-color: #f8fafc;
      --verse-num: #60a5fa;
      --footnote-bg: #162032;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background 0.2s, color 0.2s;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 0.65rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--heading-color);
      text-decoration: none;
      white-space: nowrap;
    }

    .brand-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .menu-btn {
      display: none;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.4rem 0.65rem;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .search-wrap {
      flex: 1;
      min-width: 200px;
      max-width: 440px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.45rem 2.2rem 0.45rem 0.85rem;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }

    .search-input:focus { border-color: var(--accent); }

    .search-clear {
      position: absolute;
      right: 0.55rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      font-size: 1rem;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-left: auto;
    }

    .ctrl-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.38rem 0.62rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: 290px 1fr;
      max-width: 1280px;
      margin: 0 auto;
      min-height: calc(100vh - 58px);
    }

    .sidebar {
      border-right: 1px solid var(--border);
      background: var(--surface);
      padding: 1rem;
      height: calc(100vh - 58px);
      position: sticky;
      top: 58px;
      overflow-y: auto;
    }

    .testament-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
      margin-bottom: 0.85rem;
    }

    .tab-btn {
      padding: 0.48rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .book-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
      margin-bottom: 1.1rem;
    }

    .book-btn {
      text-align: left;
      padding: 0.42rem 0.55rem;
      border-radius: 7px;
      border: 1px solid transparent;
      background: var(--bg);
      color: var(--text);
      font-size: 0.84rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .book-btn:hover { border-color: var(--border); }

    .book-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }

    .chapter-section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      margin: 0.5rem 0;
    }

    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.35rem;
    }

    .chap-btn {
      padding: 0.38rem 0;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.82rem;
      cursor: pointer;
      text-align: center;
    }

    .chap-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 700;
    }

    .main {
      padding: 2rem clamp(1rem, 4vw, 3.2rem) 4rem;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .chapter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .chapter-title {
      margin: 0;
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--heading-color);
    }

    .chapter-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .nav-btns { display: flex; gap: 0.5rem; }

    .nav-btn {
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .verses {
      font-size: var(--font-size);
      line-height: 1.88;
    }

    .section-heading {
      font-size: 1.05em;
      font-weight: 700;
      color: var(--heading-color);
      margin: 1.6rem 0 0.65rem;
      padding-left: 0.65rem;
      border-left: 3px solid var(--accent);
    }

    .section-heading:first-child { margin-top: 0.2rem; }

    .verse-row {
      padding: 0.35rem 0.5rem;
      border-radius: 8px;
      margin-bottom: 0.25rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .verse-row:hover { background: var(--surface-2); }
    .verse-row.highlight { background: var(--accent-soft); }

    .verse-num {
      display: inline-block;
      min-width: 1.6em;
      font-size: 0.78em;
      font-weight: 700;
      color: var(--verse-num);
      vertical-align: super;
      margin-right: 0.25rem;
      user-select: none;
    }

    .footnotes {
      margin: 0.25rem 0 0.6rem 1.4rem;
      padding: 0.45rem 0.75rem;
      border-radius: 7px;
      background: var(--footnote-bg);
      border-left: 2px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .hidden-fn .footnotes { display: none; }

    .search-panel { display: none; }
    .search-panel.active { display: block; }

    .search-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .search-item {
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      margin-bottom: 0.65rem;
      cursor: pointer;
    }

    .search-item:hover { border-color: var(--accent); }

    .search-ref {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }

    mark {
      background: #fde047;
      color: #0f172a;
      padding: 0 0.15rem;
      border-radius: 3px;
    }

    .loading {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 50;
    }

    .toast.show { opacity: 1; }

    footer {
      margin-top: 3rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    footer a { color: var(--accent); text-decoration: none; }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .menu-btn { display: inline-block; }
      .sidebar {
        position: fixed;
        left: -100%;
        top: 58px;
        width: 290px;
        z-index: 40;
        transition: left 0.22s ease;
        box-shadow: 4px 0 20px rgba(0,0,0,0.18);
      }
      .sidebar.open { left: 0; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="목차 열기">☰ 목차</button>
    <a class="brand" href="#GEN/1" id="homeLink">
      <span>📖 새김역 성경</span>
      <span class="brand-badge">SKV</span>
    </a>

    <div class="search-wrap">
      <input id="searchInput" class="search-input" type="search" placeholder="본문 검색 또는 구절 이동 (예: 창세기 1:1, 사랑)" />
      <button id="searchClear" class="search-clear" title="검색 지우기">✕</button>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="fnToggle" title="각주 표시 전환">각주 ON</button>
      <button class="ctrl-btn" id="fontDown" title="글자 작게">가-</button>
      <button class="ctrl-btn" id="fontUp" title="글자 크게">가+</button>
      <button class="ctrl-btn" id="themeBtn" title="테마 전환">☀️ 밝게</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="testament-tabs">
        <button class="tab-btn active" data-testament="OT">구약 (39권)</button>
        <button class="tab-btn" data-testament="NT">신약 (27권)</button>
      </div>
      <div class="book-grid" id="bookGrid"></div>
      <div class="chapter-section-title" id="chapTitle">장 선택</div>
      <div class="chapter-grid" id="chapterGrid"></div>
    </aside>

    <main class="main" id="main">
      <div class="loading" id="loading">성경 본문(66권)을 불러오는 중입니다...</div>

      <section id="readerView" style="display:none;">
        <div class="chapter-header">
          <div>
            <h1 class="chapter-title" id="chapterTitle"></h1>
            <div class="chapter-subtitle" id="chapterSubtitle"></div>
          </div>
          <div class="nav-btns">
            <button class="nav-btn" id="prevChap">← 이전 장</button>
            <button class="nav-btn" id="nextChap">다음 장 →</button>
          </div>
        </div>
        <div class="verses" id="versesContainer"></div>
        <div class="nav-btns" style="margin-top:2rem; justify-content:space-between;">
          <button class="nav-btn" id="prevChapBottom">← 이전 장</button>
          <button class="nav-btn" id="nextChapBottom">다음 장 →</button>
        </div>
      </section>

      <section class="search-panel" id="searchPanel">
        <div class="search-meta">
          <span id="searchCount"></span>
          <button class="ctrl-btn" id="closeSearch">읽기 화면으로</button>
        </div>
        <div id="searchResults"></div>
      </section>

      <footer>
        <span>원문: Berean Standard Bible (Public Domain) · 본문 라이선스: CC BY-NC-ND 4.0</span>
        <span>
          <a href="https://github.com/FromJeju/bible_bsb2skv" target="_blank" rel="noopener">GitHub 저장소</a>
        </span>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast">클립보드에 복사되었습니다.</div>

  <script>
    const DATA_URLS = [
      './output/json/skv_bible.json',
      '../output/json/skv_bible.json'
    ];

    let bible = null;
    let currentTestament = 'OT';
    let currentBookIdx = 0;
    let currentChapIdx = 0;
    let showFootnotes = true;
    let fontSize = Number(localStorage.getItem('skv_font_size')) || 17;
    const themes = ['light', 'sepia', 'dark'];
    const themeLabels = { light: '☀️ 밝게', sepia: '📜 세피아', dark: '🌙 어둡게' };
    let themeIdx = Math.max(0, themes.indexOf(localStorage.getItem('skv_theme') || 'light'));

    const $ = (id) => document.getElementById(id);

    function applyTheme() {
      const t = themes[themeIdx];
      document.documentElement.setAttribute('data-theme', t);
      $('themeBtn').textContent = themeLabels[t];
      localStorage.setItem('skv_theme', t);
    }

    function applyFontSize() {
      document.documentElement.style.setProperty('--font-size', fontSize + 'px');
      localStorage.setItem('skv_font_size', String(fontSize));
    }

    function showToast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1800);
    }

    async function loadData() {
      for (const url of DATA_URLS) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            bible = await res.json();
            return;
          }
        } catch (_) {}
      }
      throw new Error('성경 데이터를 불러오지 못했습니다.');
    }

    function renderSidebar() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.testament === currentTestament);
      });

      const bookGrid = $('bookGrid');
      bookGrid.innerHTML = '';
      bible.books.forEach((b, idx) => {
        if (b.testament !== currentTestament) return;
        const btn = document.createElement('button');
        btn.className = 'book-btn' + (idx === currentBookIdx ? ' active' : '');
        btn.textContent = b.name;
        btn.onclick = () => selectLocation(idx, 0);
        bookGrid.appendChild(btn);
      });

      const book = bible.books[currentBookIdx];
      $('chapTitle').textContent = `${book.name} — 장 선택 (${book.chapters.length}장)`;
      const chapGrid = $('chapterGrid');
      chapGrid.innerHTML = '';
      book.chapters.forEach((c, idx) => {
        const btn = document.createElement('button');
        btn.className = 'chap-btn' + (idx === currentChapIdx ? ' active' : '');
        btn.textContent = c.chapter;
        btn.onclick = () => {
          selectLocation(currentBookIdx, idx);
          $('sidebar').classList.remove('open');
        };
        chapGrid.appendChild(btn);
      });
    }

    function renderChapter(highlightVerse = null) {
      $('searchPanel').classList.remove('active');
      $('readerView').style.display = 'block';

      const book = bible.books[currentBookIdx];
      const chap = book.chapters[currentChapIdx];
      $('chapterTitle').textContent = `${book.name} ${chap.chapter}장`;
      $('chapterSubtitle').textContent = `${book.id} ${chap.chapter} · 총 ${chap.verses.length}절`;

      const container = $('versesContainer');
      container.className = 'verses' + (showFootnotes ? '' : ' hidden-fn');
      container.innerHTML = '';

      chap.verses.forEach(v => {
        if (v.heading) {
          const h = document.createElement('div');
          h.className = 'section-heading';
          h.textContent = v.heading;
          container.appendChild(h);
        }

        const row = document.createElement('div');
        row.className = 'verse-row' + (highlightVerse === v.verse ? ' highlight' : '');
        row.id = `v-${v.verse}`;
        row.title = '클릭하여 구절 복사';

        const num = document.createElement('span');
        num.className = 'verse-num';
        num.textContent = v.verse;

        const text = document.createElement('span');
        text.innerHTML = escapeHtml(v.text).replace(/\n/g, '<br>');

        row.appendChild(num);
        row.appendChild(text);
        row.onclick = () => {
          const quote = `${book.name} ${chap.chapter}:${v.verse} ${v.text.replace(/\n/g, ' ')} (SKV)`;
          navigator.clipboard?.writeText(quote).then(() => showToast(`${book.name} ${chap.chapter}:${v.verse} 복사됨`));
        };
        container.appendChild(row);

        if (v.footnotes && v.footnotes.length) {
          const fn = document.createElement('div');
          fn.className = 'footnotes';
          fn.textContent = '각주: ' + v.footnotes.join(' · ');
          container.appendChild(fn);
        }
      });

      const isFirst = currentBookIdx === 0 && currentChapIdx === 0;
      const lastBook = bible.books.length - 1;
      const isLast = currentBookIdx === lastBook && currentChapIdx === bible.books[lastBook].chapters.length - 1;
      $('prevChap').disabled = $('prevChapBottom').disabled = isFirst;
      $('nextChap').disabled = $('nextChapBottom').disabled = isLast;

      if (highlightVerse) {
        document.getElementById(`v-${highlightVerse}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function selectLocation(bookIdx, chapIdx, highlightVerse = null, pushHash = true) {
      currentBookIdx = bookIdx;
      currentChapIdx = chapIdx;
      currentTestament = bible.books[bookIdx].testament;
      if (pushHash) {
        const b = bible.books[bookIdx];
        const c = b.chapters[chapIdx].chapter;
        history.replaceState(null, '', `#${b.id}/${c}`);
      }
      renderSidebar();
      renderChapter(highlightVerse);
    }

    function stepChapter(delta) {
      let b = currentBookIdx;
      let c = currentChapIdx + delta;
      if (c < 0) {
        if (b === 0) return;
        b--;
        c = bible.books[b].chapters.length - 1;
      } else if (c >= bible.books[b].chapters.length) {
        if (b >= bible.books.length - 1) return;
        b++;
        c = 0;
      }
      selectLocation(b, c);
    }

    function parseReference(q) {
      const m = q.trim().match(/^([가-힣A-Za-z0-9]+)\s*(\d+)(?::(\d+))?$/);
      if (!m) return null;
      const [, name, chStr, vStr] = m;
      const chNum = Number(chStr);
      const vNum = vStr ? Number(vStr) : null;
      const bIdx = bible.books.findIndex(b =>
        b.name === name || b.name.startsWith(name) || b.id.toLowerCase() === name.toLowerCase()
      );
      if (bIdx === -1) return null;
      const cIdx = bible.books[bIdx].chapters.findIndex(c => c.chapter === chNum);
      if (cIdx === -1) return null;
      return { bIdx, cIdx, vNum };
    }

    function runSearch(query) {
      const q = query.trim();
      if (!q) {
        $('searchPanel').classList.remove('active');
        $('readerView').style.display = 'block';
        return;
      }

      const ref = parseReference(q);
      if (ref) {
        selectLocation(ref.bIdx, ref.cIdx, ref.vNum);
        return;
      }

      const results = [];
      const lower = q.toLowerCase();
      outer: for (let bi = 0; bi < bible.books.length; bi++) {
        const book = bible.books[bi];
        for (let ci = 0; ci < book.chapters.length; ci++) {
          const chap = book.chapters[ci];
          for (const v of chap.verses) {
            if (v.text.toLowerCase().includes(lower)) {
              results.push({ bi, ci, book, chap, v });
              if (results.length >= 100) break outer;
            }
          }
        }
      }

      $('readerView').style.display = 'none';
      $('searchPanel').classList.add('active');
      $('searchCount').textContent = results.length >= 100
        ? `"${q}" 검색 결과 100건 이상 (상위 100건 표시)`
        : `"${q}" 검색 결과 ${results.length}건`;

      const list = $('searchResults');
      list.innerHTML = '';
      if (!results.length) {
        list.innerHTML = '<p style="color:var(--text-muted);">검색 결과가 없습니다.</p>';
        return;
      }

      const re = new RegExp(`(${escapeRegExp(q)})`, 'gi');
      results.forEach(({ bi, ci, book, chap, v }) => {
        const item = document.createElement('div');
        item.className = 'search-item';
        item.innerHTML = `
          <div class="search-ref">${book.name} ${chap.chapter}:${v.verse}</div>
          <div>${escapeHtml(v.text).replace(/\n/g, ' ').replace(re, '<mark>$1</mark>')}</div>
        `;
        item.onclick = () => selectLocation(bi, ci, v.verse);
        list.appendChild(item);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s]));
    }
    function escapeRegExp(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function syncFromHash() {
      const m = location.hash.match(/^#([A-Za-z0-9]+)\/(\d+)$/);
      if (!m) return false;
      const bIdx = bible.books.findIndex(b => b.id.toUpperCase() === m[1].toUpperCase());
      if (bIdx === -1) return false;
      const cIdx = bible.books[bIdx].chapters.findIndex(c => c.chapter === Number(m[2]));
      if (cIdx === -1) return false;
      selectLocation(bIdx, cIdx, null, false);
      return true;
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        currentTestament = btn.dataset.testament;
        renderSidebar();
      };
    });

    $('prevChap').onclick = $('prevChapBottom').onclick = () => stepChapter(-1);
    $('nextChap').onclick = $('nextChapBottom').onclick = () => stepChapter(1);
    $('menuBtn').onclick = () => $('sidebar').classList.toggle('open');
    $('fnToggle').onclick = () => {
      showFootnotes = !showFootnotes;
      $('fnToggle').textContent = showFootnotes ? '각주 ON' : '각주 OFF';
      $('versesContainer').classList.toggle('hidden-fn', !showFootnotes);
    };
    $('fontDown').onclick = () => { fontSize = Math.max(13, fontSize - 1); applyFontSize(); };
    $('fontUp').onclick = () => { fontSize = Math.min(26, fontSize + 1); applyFontSize(); };
    $('themeBtn').onclick = () => { themeIdx = (themeIdx + 1) % themes.length; applyTheme(); };

    let searchTimer = null;
    $('searchInput').addEventListener('input', (e) => {
      $('searchClear').style.display = e.target.value ? 'block' : 'none';
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => runSearch(e.target.value), 220);
    });
    $('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        clearTimeout(searchTimer);
        runSearch(e.target.value);
      }
    });
    $('searchClear').onclick = () => {
      $('searchInput').value = '';
      $('searchClear').style.display = 'none';
      runSearch('');
    };
    $('closeSearch').onclick = () => {
      $('searchPanel').classList.remove('active');
      $('readerView').style.display = 'block';
    };

    document.addEventListener('keydown', (e) => {
      if (document.activeElement === $('searchInput')) return;
      if (e.key === 'ArrowLeft') stepChapter(-1);
      if (e.key === 'ArrowRight') stepChapter(1);
    });

    window.addEventListener('hashchange', () => { if (bible) syncFromHash(); });

    (async function init() {
      applyTheme();
      applyFontSize();
      try {
        await loadData();
        $('loading').style.display = 'none';
        if (!syncFromHash()) {
          selectLocation(0, 0);
        }
      } catch (err) {
        $('loading').textContent = err.message;
      }
    })();
  </script>
</body>
</html>
